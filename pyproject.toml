[tool.black]
line-length = 79
target-version = ['py312']
include = '\.pyi?$'
quote-style = "single"

[tool.isort]
known_first_party = ["api", "backend", "recipes", "users"]
line_length = 79
multi_line_output = 5
lines_after_imports = 2
include_trailing_comma = true
use_parentheses = true
skip = [
    "configs",
    ".git",
    "migrations"
]
skip_glob = [
    "venv*",
    "yandex/*/venv*"
]
default_section = "THIRDPARTY"
src_paths = ["backend"]
known_django = "django"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DJANGO",
    "FIRSTPARTY",
    "LOCALFOLDER"
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors (PEP 8)
    "W",  # pycodestyle warnings (PEP 8)
    "F",  # Pyflakes (логические ошибки)
    "D",  # pydocstyle (docstrings)
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D212",  # Multi-line docstring summary should start at the first line
    "E501",  # Line too long (если у вас max-line-length = 120)
    "D105",
]

[tool.ruff.lint.per-file-ignores]

"*/migrations/*.py" = ["D101", "D100"]

[tool.ruff.format]
quote-style = "single"



[tool.flake8]
max-line-length = 79
show-source = true
statistics = true
inline-quotes = "single"
ignore = [
    "E121",
    "E126",
    "W504",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D401",
    "Q000"
]
exclude = [
    "*base.py",
    "venv*",
    ".git",
    "*/migrations/*",
    "*__pycache__*",
    "*node_modules*",
    "*docs*",
]

[tool.flake8.per-file-ignores]
"*/schemas.py" = ["N805"]
"*/admin.py" = ["JS101", "JS102"]
"*/*.py" = ["E722", "E127"]
"*/migrations/*" = ["E501"]
"*/tests/*" = ["D200", "D205", "D400"]
"*/settings/*.py" = ["F405"]